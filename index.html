.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.win::after{width:180px;height:180px;left:-70px;bottom:-90px;opacity:.12}
.win-title{font-family:var(--font-display);font-weight:var(--w-semibold);font-size:clamp(32px,4vw,44px);line-height:1.1;letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance;animation:rise .6s cubic-bezier(.16,1,.3,1) .1s both}

.ledger dt{font-size:14px;font-weight:var(--w-medium)}

.ledger dd{margin:0;font-size:20px;font-weight:var(--w-semibold);font-family:var(--font-mono)}
.ledger div:first-child dd{font-size:44px;letter-spacing:-.02em;line-height:1}
.win .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}.win .actions button{flex:0 0 auto;white-space:nowrap}

.win .play:hover{transform:translateX(2px)}
.win .play:active,.win .outline:active{transform:scale(.97)}

.voucher-go:hover{transform:translateX(2px)}
.voucher-go:active{transform:scale(.97)}
.voucher-stub{border-left:2px dashed #ffffff40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px 12px;background:#ffffff0d}
.voucher-stub b{font-size:var(--size-xl2);line-height:1;color:#fff;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-weight:var(--w-semibold)}
.voucher-stub b svg{width:42px;height:42px}
.voucher-stub small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.78);font-weight:var(--w-semibold)}
.pips{display:grid;grid-template-columns:repeat(3,14px);gap:6px;margin-bottom:12px}
.pips i{width:14px;height:14px;border-radius:4px;border:1.5px solid #ffffff55}
.pips i.on{background:#fff;border-color:#fff;animation:pop .4s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.7s + var(--i) * 60ms)}
.voucher-code{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.voucher-code code{font:var(--w-semibold) 20px/1 var(--font-mono);letter-spacing:.12em;padding:12px 16px;border:2px dashed #fff;border-radius:12px;color:#fff}
.voucher-code button{border:1px solid #ffffff73;background:transparent;color:#fff;border-radius:30px;padding:9px 15px;font-size:var(--size-base);font-weight:var(--w-semibold)}
.voucher-note{margin:12px 0 0!important;min-height:1.5em}
.voucher.opening{animation:unlock .8s cubic-bezier(.3,1.3,.5,1) .4s both}
.voucher.opening .voucher-code code{animation:pop .5s cubic-bezier(.16,1,.3,1) 1.1s both}
@keyframes unlock{0%{opacity:0;transform:translateY(16px) rotate(-2deg) scale(.94)}100%{opacity:1;transform:none}}
.locked{position:relative;min-height:440px}
.locked-content{filter:blur(7px);opacity:.55;user-select:none;max-height:440px;overflow:hidden}
.locked-overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.panel.locked{padding:0}.panel.locked .locked-content{padding:26px}
.gate{width:min(100%,430px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow-lg);animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.gate-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin-bottom:12px}
.gate-icon svg{width:18px;height:18px}
.gate h3{font-family:var(--font-display);font-weight:var(--w-semibold);font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.gate p{font-size:14px;color:var(--fg-muted);margin:0 0 16px}
.gate-row{display:flex;gap:8px}
.gate input[type=email]{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--border);border-radius:30px;background:var(--surface);color:var(--fg)}
.gate input[type=email]:focus{outline:none;border-color:var(--primary);box-shadow:var(--shadow-focus)}
.gate .play{flex:none}
.gate-check{display:flex;gap:9px;align-items:flex-start;font-size:var(--size-sm);color:var(--fg-muted);margin-top:14px;line-height:1.4;cursor:pointer}
.gate-check input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--primary);flex:none}
.gate .gate-note{font-size:12px;margin:12px 0 0;min-height:1.4em}
.gate-link{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-input);background:var(--surface);border-radius:30px;padding:10px 18px;font-weight:var(--w-semibold);font-size:14px}
.code-hidden{filter:blur(6px);user-select:none}
.voucher-go svg[viewBox="0 0 16 16"]:first-child{margin-right:-2px}
.breakdown h3{margin-bottom:16px}
.breakdown h4{font-size:16px;margin:22px 0 6px}
.bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd-grid div{background:var(--surface-soft);border-radius:14px;padding:14px}
.bd-grid small{display:block;font-size:var(--size-sm);text-transform:uppercase;letter-spacing:.06em;font-weight:var(--w-semibold);color:var(--fg-muted)}
.bd-grid b{display:block;font-size:var(--size-h-md);letter-spacing:-.02em;margin:4px 0 2px}
.bd-grid span{font-size:12px;color:var(--fg-muted);line-height:1.35;display:block}
.history{margin-top:30px}.history h2{margin-top:30px}.history>h2:first-child,.history .locked-content>h2:first-child{margin-top:0}
.history.locked{min-height:460px}
.member-note{font-size:var(--size-sm);margin-top:16px}
.revealed{animation:unblur .7s cubic-bezier(.16,1,.3,1) both}
@keyframes unblur{from{filter:blur(7px);opacity:.5}}
@keyframes grow{from{width:0}}
.next-game{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0;padding:10px 12px 10px 10px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-align:left;transition:background .15s,transform .15s cubic-bezier(.16,1,.3,1)}
.next-game:hover{background:var(--surface-soft);transform:translateX(2px)}
.next-game .swatch{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.next-name{flex:1;font-weight:var(--w-semibold);font-size:14px}
.next-name small{display:block;font-weight:500;font-size:12px;color:var(--fg-muted)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes card-in{from{opacity:0;transform:translateY(20px) rotate(7deg) scale(.95)}}
@keyframes stamp{from{opacity:0;transform:scale(2.3) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes slide{from{opacity:0;transform:translateX(-22px)}}
@keyframes sweep{0%{opacity:0;transform:rotate(-200deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:rotate(160deg)}}
@keyframes door{to{transform:scaleX(.38) skewY(-6deg)}}
@keyframes beam{from{opacity:0}}
@media(max-width:850px){.win{grid-template-columns:1fr;padding:28px;gap:26px}.win-art{width:min(100%,290px);order:-1;margin:6px 0 10px}}
@media(max-width:560px){.locked,.locked-content{min-height:420px;max-height:none}.gate{padding:20px}.gate-row{flex-direction:column}.gate .play{width:100%}.bd-grid{grid-template-columns:1fr}.voucher{grid-template-columns:1fr 96px;-webkit-mask:none;mask:none}.voucher-body{padding:22px 20px}.voucher h3{font-size:var(--size-h-md)}.voucher-stub b{font-size:32px}.pips{grid-template-columns:repeat(3,10px);gap:4px}.pips i{width:10px;height:10px}.win{padding:22px 20px 26px;border-radius:22px}.ledger div:first-child dd{font-size:var(--size-xl)}.stamp{width:86px;height:86px;font-size:var(--size-xs);right:-12px;bottom:-14px}.burst{right:30px;bottom:30px}}
@media(prefers-reduced-motion:reduce){.gate,.revealed,.share,.voucher,.voucher.opening,.voucher-code code,.pips i.on,.win-title,.win-sub,.ledger div,.win-art,.stamp,.pop,.slide,.chip.now,.beam{animation:none}.draw{animation:none;stroke-dashoffset:0}.sweep,.burst{display:none}.door{animation:none;transform:scaleX(.38) skewY(-6deg)}}

.card.is-locked{background:var(--surface-soft)}
.card.is-locked .art{filter:grayscale(1);opacity:.5}
.card.is-locked h3,.card.is-locked p{color:var(--fg-muted)}
.card.is-locked .play{background:var(--bg-secondary);color:var(--fg-muted);opacity:1;justify-content:flex-start}
.card.is-locked .play svg,.dot svg,.lvl-nav svg,.next-game .swatch svg{width:14px;height:14px;vertical-align:-2px}
.dot.off{background:var(--surface-soft);color:var(--fg-placeholder);border-style:dashed}
.levels{display:flex;gap:4px;margin:auto 0 14px;padding-top:4px}
.levels i{flex:1;height:4px;background:var(--border)}
.levels i.on{background:var(--primary)}
.lvl-nav{display:flex;gap:6px;flex-wrap:wrap}
.lvl-nav button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border-input);border-radius:10px;background:var(--surface);color:var(--fg);font:var(--w-semibold) 14px/1 var(--font-mono)}
.lvl-nav button.won{border-color:var(--success);color:var(--success);background:var(--success-soft)}
.lvl-nav button.now{background:var(--primary);border-color:var(--primary);color:#fff}
.lvl-nav button:disabled{color:var(--fg-disabled);background:var(--surface-soft);border-style:dashed;opacity:1;cursor:not-allowed}
.lvl-nav button:not(:disabled):not(.now):hover{border-color:var(--primary);color:var(--primary)}
.next-game:disabled{opacity:1;cursor:not-allowed;background:var(--surface-soft)}
.next-game:disabled .swatch{background:var(--bg-secondary);color:var(--fg-muted)}
.next-game:disabled .next-name{color:var(--fg-muted)}
.next-game:disabled:hover{transform:none}
@media(max-width:640px){.section-head .lvl-nav{margin-top:12px}}
@media(prefers-reduced-motion:reduce){.run-card,.reveal-banner{animation:none}}

.link-btn{display:flex;width:fit-content;align-items:center;gap:6px;margin-top:14px;padding:0;border:0;background:none;color:var(--primary);font-weight:var(--w-semibold);font-size:14px}
.link-btn:hover{color:var(--tertiary-2)}
.prog-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.prog-head h1{font-size:var(--size-xl3);margin:26px 0 8px}
.prog-head p{margin:0}
.prog-cta{width:auto;display:inline-flex;align-items:center;gap:10px;flex:none}
.prog-stats{grid-template-columns:repeat(4,1fr);margin:0 0 20px}
.prog-total{margin:0;gap:2px}
.prog-total i{height:6px}
.prog-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;margin:20px 0 30px;align-items:start}
.prog-grid h2{margin:0 0 4px}
.prog-sub{font-size:14px;margin:0 0 18px}
.prog-list,.rewards{list-style:none;margin:0;padding:0}
.prog-row{display:grid;grid-template-columns:minmax(180px,1fr) auto 72px;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--border)}
.prog-game{display:flex;align-items:center;gap:12px;min-width:0}
.prog-num{font:var(--w-medium) 12px var(--font-mono);color:var(--fg-placeholder)}
.prog-game .swatch{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.prog-game .swatch svg,.lv svg{width:14px;height:14px}
.prog-name{font-weight:var(--w-semibold);font-size:14px;min-width:0}
.prog-name small{display:block;font-weight:var(--w-regular);font-size:12px;color:var(--fg-muted);margin-top:2px}
.prog-row.is-locked .prog-name{color:var(--fg-muted)}
.prog-row.mastered .prog-name small{color:var(--success)}
.prog-levels{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.lv{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--fg);padding:0}
.lv small{font:var(--w-medium) 10px var(--font-mono);color:var(--fg-muted)}
.lv b{font:var(--w-semibold) 13px/1 var(--font-mono)}
.lv.won{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 40%,transparent)}
.lv.won b{color:var(--success)}
.lv.next{border-color:var(--primary);color:var(--primary)}
.lv.next b{font-family:var(--font-body)}
.lv.next:hover{background:var(--primary);color:#fff}.lv.next:hover small{color:#fff}
.lv.off{background:var(--surface-soft);border-style:dashed;color:var(--fg-disabled)}
.prog-pts{text-align:right}
.prog-pts b{display:block;font:var(--w-semibold) 16px var(--font-mono)}
.prog-pts small{font-size:12px;color:var(--fg-muted)}
@media(max-width:1000px){.prog-grid{grid-template-columns:1fr}}
@media(max-width:700px){.prog-head{flex-direction:column;align-items:stretch}.prog-cta{justify-content:space-between}.prog-stats{grid-template-columns:1fr 1fr;row-gap:16px}.prog-row{grid-template-columns:1fr auto;row-gap:12px}.prog-levels{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(5,1fr)}.prog-pts{grid-column:2;grid-row:1}.prog-head h1{font-size:var(--size-xl)}}

.focus .nav>small,.focus .nav-actions{display:none}
.run{display:flex;flex-direction:column;justify-content:flex-start;max-width:960px;margin:0 auto;padding:24px 0 48px}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.run-top .eyebrow{margin:0}
.run-dots{margin:0}
.dot.cur{border-color:var(--primary);color:var(--primary);box-shadow:var(--shadow-focus)}
.run-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--border);border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-md);animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.run-card .art{height:100%;min-height:340px;display:grid;place-items:center}
.run-card .game-illustration{width:100%;max-width:480px}
.run-body{padding:40px;display:flex;flex-direction:column;justify-content:center}
.run-body h1{font-size:var(--size-xl3);margin:16px 0 12px}
.run-body>p{font-size:16px;color:var(--fg-muted);margin:0 0 28px}
.run-go{display:flex;align-items:center;width:100%;font-size:16px;padding:14px 22px;justify-content:space-between;gap:12px}
.dot.yes.cur{color:#fff}
.run-body .run-note{font-size:12px;margin:16px 0 0;color:var(--fg-muted)}
.reveal-banner{display:flex;gap:14px;align-items:flex-start;margin:0 0 28px;padding:18px 22px;border-radius:16px;background:var(--success-soft);border:1px solid color-mix(in srgb,var(--success) 35%,transparent);animation:rise .6s cubic-bezier(.16,1,.3,1) both}
.reveal-mark{flex:none;width:28px;height:28px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center}
.reveal-banner strong{font-size:16px}
.reveal-banner p{margin:2px 0 0;font-size:14px;color:var(--fg-muted)}
@media(max-width:760px){.run{min-height:0;padding-top:8px}.run-card{grid-template-columns:1fr}.run-card .art{min-height:200px}.run-body{padding:24px}.run-body h1{font-size:var(--size-xl)}}

.hotspot.idle{pointer-events:none;font-size:0;opacity:.35;filter:grayscale(1)}

.chest{display:block;width:72px;height:auto;overflow:visible}
.chest.big{width:92px}
.chest.dim{filter:grayscale(1);opacity:.55}
.chest-glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.6}}
.rewards-card{margin-bottom:24px}
.rewards-card.opening .r-opened .chest{animation:chest-pop .7s cubic-bezier(.3,1.5,.5,1) .5s both}
@keyframes chest-pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.r-opened{display:flex;gap:18px;align-items:center;padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.r-opened .chest{width:110px;flex:none}

.r-opened h3{margin:0 0 4px}

.rtrack-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:46px}

.rbar{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:0 28px 22px 0}

.rmark{position:absolute;bottom:2px;transform:translateX(-62%);pointer-events:none}

.rmark .chest.big{width:54px}
.rprev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tiers.stack{grid-template-columns:1fr}
.tier{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}

.tier-body{min-width:0;flex:1}
.tier-head{display:flex;justify-content:space-between;gap:8px}
.tier-head strong{font-size:14px}
.tier-count{font:var(--w-medium) 12px var(--font-mono);color:var(--fg-muted)}
.tier-reward{margin:4px 0 8px;font-size:14px;font-weight:var(--w-semibold);color:#4d3d15}
.tier-mystery{margin:4px 0 2px;font-size:14px;font-weight:var(--w-semibold);color:var(--fg-muted)}
.tier-goal{margin:0;font-size:12px;color:var(--fg-muted)}
.r-code{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.r-code button{border:1px solid var(--border-input);background:var(--surface);border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:var(--w-semibold);display:inline-flex;gap:6px;align-items:center}

.rtease p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.85)}
.run .rtrack{margin-top:20px;padding:22px 24px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.tickets{margin-top:20px;display:grid;gap:12px}
.ticket{display:grid;grid-template-columns:1fr 84px;background:var(--gradient-brand);color:#fff;border-radius:18px;overflow:hidden}
.ticket-main{padding:20px 22px}

.wheel-pop .eyebrow{font-family:var(--font-mono);margin:0 0 6px}
.wheel-pop p.muted{font-size:14px;margin:0 0 18px}
.wheel-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:var(--size-h-lg);line-height:1}

function wordPaths() {

      for (let v of shuf(nb(p.at(-1)), r)) {
        if (cells[v] >= 0) continue;
        cells[v] = k;
        p.push(v);
        if (grow(k, p)) return true;
        p.pop();
        cells[v] = -1;
      }
      return false;

function logicPuzzle() {
  return today$("logic", () => {
    let r = rng("logic"),
      g = Array(16).fill(0);
    let ok = (g, i) => {
      let v = g[i],
        R = i >> 2,
        C = i & 3,
        B = (R >> 1) * 8 + (C >> 1) * 2;
      for (let k = 0; k < 4; k++) {
        let a = R * 4 + k,
          b = k * 4 + C,
          c = B + (k >> 1) * 4 + (k & 1);

          return false;
      }
      return true;
    };
    let fill = (i) => {
      if (i === 16) return true;
      for (let v of shuf([1, 2, 3, 4], r)) {
        g[i] = v;
        if (ok(g, i) && fill(i + 1)) return true;
      }
      g[i] = 0;

    };

      let i = g.indexOf(0);
      if (i < 0) return 1;

      for (let v = 1; v <= 4 && n < lim; v++) {
        g[i] = v;
        if (ok(g, i)) n += count(g, lim - n);

      g[i] = 0;
      return n;
    };
    fill(0);
    let sol = [...g],
      given = [...Array(16).keys()],
      target = curve("logic");

function redeemCode(raw) {

  if (!code) return { error: "Enter a code." };
  let c = codeCatalog().find((x) => x.code === code);
  if (!c) return { error: "We don't recognise that code. Check it and try again." };
  let used = store.redeemed.find((x) => x.code === code);
  if (used) return { error: `You already redeemed ${code} on ${new Date(used.at).toLocaleDateString()}.` };
  if (!c.earned) return { error: "That code belongs to a Play reward you haven't unlocked yet." };
  store.redeemed.push({ code, reward: c.reward, at: new Date().toISOString(), email: store.member.email });
  save();
  track("code_redeem", { code, code_type: TIERS.some((t) => t.code === code) ? "chest" : WHEEL.some((w) => w.code === code) ? "wheel" : "event" });

}

// Emails a redeemed code through Play's Worker. Returns "sent", "already", "off" (no server yet) or "failed".
async function emailCode(code) {
  if (!PLAY_API || typeof fetch !== "function" || !member()) return "off";
  try {
    let r = await fetch(PLAY_API + "/send-code", {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({ email: store.member.email, name: store.member.name, code }),
      }),
      j = await r.json().catch(() => ({})),
      st = r.ok ? (j.sent ? "sent" : "already") : "failed",
      rec = store.redeemed.find((x) => x.code === code);
    if (rec && st !== "failed") {
      rec.emailed = true;
      save();
    }
    return st;
  } catch (e) {
    return "failed";
  }
}

    r = redeemCode(code);
  if (!box) return;
  box.querySelectorAll("button").forEach((b) => b.remove());
  let note = box.querySelector("[role=status]");
  if (!r.ok) {
    note.innerHTML = `<span class="r-used bad">${esc(r.error)}</span>`;
    return;
  }
  note.innerHTML = `<span class="r-used">${ICON.check} Redeemed</span> <span class="r-mail">${mailNote(PLAY_API ? "sending" : "off")}</span>`;
  if (PLAY_API) {

  }

else if (liBack?.view === "redeem") showRedeem();
else if (liBack?.view === "stats") showStats();
else home();
// Retry a signup that failed to reach the server on an earlier visit
sendLead();
